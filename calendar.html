<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Calendar — 나만의 캘린더</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>" />
  <style>
:root {
  --sky-50: #f4fafd;
  --sky-100: #e7f5fc;
  --sky-200: #d3ecf8;
  --sky-300: #b0dcf2;
  --sky-400: #86c8e8;
  --sky-500: #5aaedb;
  --sky-600: #3f8fc0;
  --sky-700: #2f6f9c;
  --navy-900: #1c3548;
  --navy-700: #2c4a60;
  --white: #ffffff;
  --gold: #c9a86a;
  --shadow-soft: 0 10px 30px rgba(63, 143, 192, 0.14);
  --shadow-card: 0 4px 18px rgba(63, 143, 192, 0.1);
  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 9px;
  --font-serif: "Nanum Myeongjo", "Noto Serif KR", Georgia, "Times New Roman", serif;
  --font-sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-sans);
  color: var(--navy-900);
  background:
    radial-gradient(circle at 12% 8%, rgba(134, 200, 232, 0.35), transparent 45%),
    radial-gradient(circle at 88% 92%, rgba(90, 174, 219, 0.28), transparent 45%),
    linear-gradient(160deg, #eef8fd 0%, #ffffff 45%, #e7f4fb 100%);
  min-height: 100vh;
}
.app {
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 24px 40px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 18px;
  padding: 18px 28px;
  background: linear-gradient(135deg, rgba(255,255,255,0.85), rgba(231,245,252,0.85));
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  backdrop-filter: blur(6px);
  margin-bottom: 22px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon { font-size: 26px; color: var(--sky-600); text-shadow: 0 2px 8px rgba(90, 174, 219, 0.4); }
.brand-text h1 { margin: 0; font-family: var(--font-serif); font-size: 24px; letter-spacing: 0.5px; color: var(--navy-900); }
.brand-text p { margin: 2px 0 0; font-size: 12.5px; color: var(--sky-700); letter-spacing: 1.5px; }
.brand-links { margin-left: auto; }
.brand-links a { font-size: 13px; color: var(--sky-600); text-decoration: none; padding: 6px 14px; border: 1px solid var(--sky-300); border-radius: 999px; transition: all 0.15s; }
.brand-links a:hover { background: var(--sky-500); color: var(--white); }
.date-nav { display: flex; align-items: center; gap: 10px; }
.current-month { font-family: var(--font-serif); font-size: 19px; min-width: 130px; text-align: center; color: var(--navy-900); }
.nav-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--sky-300); background: var(--white); color: var(--sky-700); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.18s ease; }
.nav-btn:hover { background: var(--sky-500); color: var(--white); transform: translateY(-1px); box-shadow: 0 6px 14px rgba(90, 174, 219, 0.35); }
.today-btn { padding: 8px 18px; border-radius: 999px; border: none; background: linear-gradient(135deg, var(--sky-500), var(--sky-600)); color: var(--white); font-size: 13.5px; letter-spacing: 0.5px; cursor: pointer; box-shadow: 0 6px 16px rgba(63, 143, 192, 0.35); transition: transform 0.18s ease; }
.today-btn:hover { transform: translateY(-1px); }
.app-main { display: grid; grid-template-columns: 1.6fr 1fr; gap: 22px; align-items: start; flex: 1; }
.calendar-panel, .side-panel { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(255, 255, 255, 0.7); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); padding: 20px 22px 24px; }
.weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12.5px; letter-spacing: 1px; color: var(--sky-700); padding-bottom: 10px; border-bottom: 1px solid var(--sky-100); margin-bottom: 10px; }
.weekdays .sun { color: #d98080; }
.weekdays .sat { color: var(--sky-600); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day-cell { position: relative; min-height: 78px; padding: 8px 8px 6px; border-radius: var(--radius-sm); background: var(--sky-50); border: 1px solid transparent; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.15s ease; }
.day-cell:hover { background: var(--sky-100); border-color: var(--sky-300); }
.day-cell.other-month { background: transparent; opacity: 0.38; }
.day-cell .day-num { font-size: 13.5px; font-weight: 600; color: var(--navy-700); }
.day-cell.sunday .day-num { color: #c96b6b; }
.day-cell.saturday .day-num { color: var(--sky-600); }
.day-cell.is-today { background: linear-gradient(150deg, var(--sky-200), var(--sky-100)); border-color: var(--sky-400); }
.day-cell.is-today .day-num { color: var(--sky-700); }
.day-cell.is-selected { background: linear-gradient(150deg, var(--sky-500), var(--sky-600)); border-color: var(--sky-600); box-shadow: 0 8px 20px rgba(63, 143, 192, 0.35); }
.day-cell.is-selected .day-num { color: var(--white); }
.day-markers { display: flex; gap: 4px; flex-wrap: wrap; }
.marker { width: 6px; height: 6px; border-radius: 50%; }
.marker.todo { background: var(--sky-600); }
.marker.memo { background: var(--gold); }
.day-cell.is-selected .marker.todo { background: var(--white); }
.day-cell.is-selected .marker.memo { background: #f4e4c1; }
.day-cell .todo-count { font-size: 10.5px; color: var(--sky-700); background: var(--white); border-radius: 999px; padding: 1px 6px; align-self: flex-end; }
.day-cell.is-selected .todo-count { background: rgba(255,255,255,0.25); color: var(--white); }
.selected-date-header h2 { font-family: var(--font-serif); margin: 0; font-size: 20px; color: var(--navy-900); }
.selected-date-header p { margin: 4px 0 16px; font-size: 12.5px; color: var(--sky-700); letter-spacing: 0.5px; }
.tab-switch { display: flex; gap: 6px; background: var(--sky-50); padding: 5px; border-radius: 999px; margin-bottom: 18px; }
.tab-btn { flex: 1; border: none; background: transparent; padding: 9px 10px; border-radius: 999px; font-size: 13.5px; color: var(--sky-700); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.18s ease; }
.tab-btn.active { background: linear-gradient(135deg, var(--sky-500), var(--sky-600)); color: var(--white); box-shadow: 0 6px 14px rgba(63, 143, 192, 0.3); }
.tab-icon { font-size: 12px; }
.tab-content.hidden { display: none; }
.todo-form { display: flex; gap: 8px; margin-bottom: 14px; }
.todo-form input { flex: 1; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--sky-200); background: var(--sky-50); font-size: 14px; outline: none; transition: border-color 0.15s ease; }
.todo-form input:focus { border-color: var(--sky-500); background: var(--white); }
.add-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: linear-gradient(135deg, var(--sky-500), var(--sky-600)); color: var(--white); font-size: 19px; cursor: pointer; flex-shrink: 0; box-shadow: 0 6px 14px rgba(63, 143, 192, 0.32); transition: transform 0.15s ease; }
.add-btn:hover { transform: translateY(-1px) scale(1.04); }
.todo-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; }
.todo-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--sky-50); border-radius: var(--radius-sm); border: 1px solid transparent; transition: all 0.15s ease; }
.todo-item:hover { border-color: var(--sky-200); }
.todo-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--sky-400); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--white); color: var(--white); font-size: 11px; transition: all 0.15s ease; }
.todo-item.done .todo-check { background: var(--sky-500); border-color: var(--sky-500); }
.todo-text { flex: 1; font-size: 14px; color: var(--navy-900); word-break: break-word; }
.todo-item.done .todo-text { text-decoration: line-through; color: #9db4c2; }
.todo-delete { border: none; background: transparent; color: #c9a1a1; font-size: 16px; cursor: pointer; opacity: 0; transition: opacity 0.15s ease; padding: 2px 4px; }
.todo-item:hover .todo-delete { opacity: 1; }
.empty-hint { text-align: center; color: var(--sky-600); font-size: 13px; padding: 24px 0; margin: 0; opacity: 0.8; }
.todo-progress { margin-top: 14px; font-size: 12px; color: var(--sky-700); text-align: right; }
.memo-text { width: 100%; min-height: 320px; resize: vertical; border: 1px solid var(--sky-200); background: var(--sky-50); border-radius: var(--radius-md); padding: 14px 16px; font-size: 14px; line-height: 1.6; font-family: var(--font-sans); color: var(--navy-900); outline: none; transition: border-color 0.15s ease; }
.memo-text:focus { border-color: var(--sky-500); background: var(--white); }
.memo-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 11.5px; color: var(--sky-600); }
.save-indicator { opacity: 0; transition: opacity 0.3s ease; }
.save-indicator.show { opacity: 1; }
.app-footer { text-align: center; margin-top: 24px; font-size: 11.5px; color: var(--sky-600); letter-spacing: 0.4px; }
.todo-list::-webkit-scrollbar { width: 6px; }
.todo-list::-webkit-scrollbar-thumb { background: var(--sky-300); border-radius: 999px; }
@media (max-width: 860px) {
  .app-main { grid-template-columns: 1fr; }
  .app-header { flex-direction: column; align-items: flex-start; }
  .date-nav { width: 100%; justify-content: space-between; }
}
@media (max-width: 480px) {
  .app { padding: 16px 12px 28px; }
  .day-cell { min-height: 58px; padding: 6px; }
  .current-month { font-size: 16px; min-width: unset; }
}
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">✦</span>
        <div class="brand-text">
          <h1>My Calendar</h1>
          <p>나만의 캘린더</p>
        </div>
      </div>

      <div class="brand-links">
        <a href="index.html">MES 사이트로 이동</a>
      </div>

      <div class="date-nav">
        <button id="prevMonth" class="nav-btn" aria-label="이전 달">‹</button>
        <div class="current-month" id="currentMonth"></div>
        <button id="nextMonth" class="nav-btn" aria-label="다음 달">›</button>
        <button id="todayBtn" class="today-btn">오늘</button>
      </div>
    </header>

    <main class="app-main">
      <section class="calendar-panel">
        <div class="weekdays">
          <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </section>

      <aside class="side-panel">
        <div class="selected-date-header">
          <h2 id="selectedDateLabel"></h2>
          <p id="selectedDateSub"></p>
        </div>

        <div class="tab-switch" role="tablist">
          <button class="tab-btn active" data-tab="todo" role="tab">
            <span class="tab-icon">✓</span> 할 일
          </button>
          <button class="tab-btn" data-tab="memo" role="tab">
            <span class="tab-icon">✎</span> 메모
          </button>
        </div>

        <div class="tab-content" id="todoTab">
          <form id="todoForm" class="todo-form" autocomplete="off">
            <input type="text" id="todoInput" placeholder="할 일을 입력하세요" maxlength="200" />
            <button type="submit" class="add-btn" aria-label="추가">+</button>
          </form>
          <ul class="todo-list" id="todoList"></ul>
          <p class="empty-hint" id="todoEmptyHint">이 날의 할 일이 없습니다.</p>
          <div class="todo-progress" id="todoProgress"></div>
        </div>

        <div class="tab-content hidden" id="memoTab">
          <textarea id="memoText" class="memo-text" placeholder="이 날의 메모를 자유롭게 남겨보세요..."></textarea>
          <div class="memo-footer">
            <span class="save-indicator" id="saveIndicator">저장됨</span>
            <span class="char-count" id="charCount">0자</span>
          </div>
        </div>
      </aside>
    </main>

    <footer class="app-footer">
      <p>모든 데이터는 이 브라우저에만 안전하게 저장됩니다.</p>
    </footer>
  </div>

  <script>
(function () {
  "use strict";

  const STORAGE_KEY = "my-calendar-data-v1";
  const WEEKDAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];

  const state = {
    viewYear: new Date().getFullYear(),
    viewMonth: new Date().getMonth(),
    selectedKey: formatKey(new Date()),
    data: loadData(),
    activeTab: "todo",
  };

  const el = {
    currentMonth: document.getElementById("currentMonth"),
    calendarGrid: document.getElementById("calendarGrid"),
    prevMonth: document.getElementById("prevMonth"),
    nextMonth: document.getElementById("nextMonth"),
    todayBtn: document.getElementById("todayBtn"),
    selectedDateLabel: document.getElementById("selectedDateLabel"),
    selectedDateSub: document.getElementById("selectedDateSub"),
    tabBtns: document.querySelectorAll(".tab-btn"),
    todoTab: document.getElementById("todoTab"),
    memoTab: document.getElementById("memoTab"),
    todoForm: document.getElementById("todoForm"),
    todoInput: document.getElementById("todoInput"),
    todoList: document.getElementById("todoList"),
    todoEmptyHint: document.getElementById("todoEmptyHint"),
    todoProgress: document.getElementById("todoProgress"),
    memoText: document.getElementById("memoText"),
    saveIndicator: document.getElementById("saveIndicator"),
    charCount: document.getElementById("charCount"),
  };

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  }

  function formatKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  function getDayEntry(key) {
    return state.data[key] || { todos: [], memo: "" };
  }

  function ensureDayEntry(key) {
    if (!state.data[key]) {
      state.data[key] = { todos: [], memo: "" };
    }
    return state.data[key];
  }

  function pruneIfEmpty(key) {
    const entry = state.data[key];
    if (entry && entry.todos.length === 0 && !entry.memo.trim()) {
      delete state.data[key];
    }
  }

  function renderCalendar() {
    const { viewYear, viewMonth } = state;
    el.currentMonth.textContent = `${viewYear}년 ${viewMonth + 1}월`;
    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    const startOffset = firstOfMonth.getDay();
    const gridStart = new Date(viewYear, viewMonth, 1 - startOffset);
    const todayKey = formatKey(new Date());
    el.calendarGrid.innerHTML = "";
    for (let i = 0; i < 42; i++) {
      const cellDate = new Date(gridStart);
      cellDate.setDate(gridStart.getDate() + i);
      const key = formatKey(cellDate);
      const isOtherMonth = cellDate.getMonth() !== viewMonth;
      const dow = cellDate.getDay();
      const cell = document.createElement("div");
      cell.className = "day-cell";
      if (isOtherMonth) cell.classList.add("other-month");
      if (dow === 0) cell.classList.add("sunday");
      if (dow === 6) cell.classList.add("saturday");
      if (key === todayKey) cell.classList.add("is-today");
      if (key === state.selectedKey) cell.classList.add("is-selected");
      cell.dataset.key = key;
      const dayNum = document.createElement("div");
      dayNum.className = "day-num";
      dayNum.textContent = cellDate.getDate();
      cell.appendChild(dayNum);
      const entry = state.data[key];
      const markerWrap = document.createElement("div");
      markerWrap.className = "day-markers";
      if (entry) {
        const pending = entry.todos.filter((t) => !t.done).length;
        if (entry.todos.length > 0) {
          const m = document.createElement("span");
          m.className = "marker todo";
          markerWrap.appendChild(m);
        }
        if (entry.memo && entry.memo.trim()) {
          const m = document.createElement("span");
          m.className = "marker memo";
          markerWrap.appendChild(m);
        }
        if (pending > 0) {
          const countBadge = document.createElement("span");
          countBadge.className = "todo-count";
          countBadge.textContent = pending;
          cell.appendChild(countBadge);
        }
      }
      cell.appendChild(markerWrap);
      cell.addEventListener("click", () => selectDate(key));
      el.calendarGrid.appendChild(cell);
    }
  }

  function selectDate(key) {
    state.selectedKey = key;
    const [y, m] = key.split("-").map(Number);
    if (y !== state.viewYear || m - 1 !== state.viewMonth) {
      state.viewYear = y;
      state.viewMonth = m - 1;
    }
    renderCalendar();
    renderSidePanel();
  }

  function renderSidePanel() {
    const key = state.selectedKey;
    const [y, m, d] = key.split("-").map(Number);
    const dateObj = new Date(y, m - 1, d);
    el.selectedDateLabel.textContent = `${m}월 ${d}일 ${WEEKDAY_NAMES[dateObj.getDay()]}요일`;
    const todayKey = formatKey(new Date());
    el.selectedDateSub.textContent = key === todayKey ? "오늘" : "";
    renderTodos();
    renderMemo();
  }

  function renderTodos() {
    const entry = getDayEntry(state.selectedKey);
    el.todoList.innerHTML = "";
    if (entry.todos.length === 0) {
      el.todoEmptyHint.style.display = "block";
      el.todoProgress.textContent = "";
      return;
    }
    el.todoEmptyHint.style.display = "none";
    entry.todos.forEach((todo) => {
      const li = document.createElement("li");
      li.className = "todo-item" + (todo.done ? " done" : "");
      const check = document.createElement("button");
      check.type = "button";
      check.className = "todo-check";
      check.setAttribute("aria-label", "완료 토글");
      check.textContent = todo.done ? "✓" : "";
      check.addEventListener("click", () => toggleTodo(todo.id));
      const text = document.createElement("span");
      text.className = "todo-text";
      text.textContent = todo.text;
      const del = document.createElement("button");
      del.type = "button";
      del.className = "todo-delete";
      del.setAttribute("aria-label", "삭제");
      del.textContent = "✕";
      del.addEventListener("click", () => deleteTodo(todo.id));
      li.appendChild(check);
      li.appendChild(text);
      li.appendChild(del);
      el.todoList.appendChild(li);
    });
    const done = entry.todos.filter((t) => t.done).length;
    el.todoProgress.textContent = `${done} / ${entry.todos.length} 완료`;
  }

  function renderMemo() {
    const entry = getDayEntry(state.selectedKey);
    el.memoText.value = entry.memo || "";
    el.charCount.textContent = `${(entry.memo || "").length}자`;
    el.saveIndicator.classList.remove("show");
  }

  function toggleTodo(id) {
    const entry = ensureDayEntry(state.selectedKey);
    const todo = entry.todos.find((t) => t.id === id);
    if (todo) todo.done = !todo.done;
    saveData();
    renderTodos();
    renderCalendar();
  }

  function deleteTodo(id) {
    const entry = ensureDayEntry(state.selectedKey);
    entry.todos = entry.todos.filter((t) => t.id !== id);
    pruneIfEmpty(state.selectedKey);
    saveData();
    renderTodos();
    renderCalendar();
  }

  function addTodo(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    const entry = ensureDayEntry(state.selectedKey);
    entry.todos.push({ id: `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`, text: trimmed, done: false });
    saveData();
    renderTodos();
    renderCalendar();
  }

  let memoSaveTimer = null;
  function handleMemoInput() {
    const value = el.memoText.value;
    el.charCount.textContent = `${value.length}자`;
    const entry = ensureDayEntry(state.selectedKey);
    entry.memo = value;
    clearTimeout(memoSaveTimer);
    memoSaveTimer = setTimeout(() => {
      pruneIfEmpty(state.selectedKey);
      saveData();
      renderCalendar();
      el.saveIndicator.classList.add("show");
      setTimeout(() => el.saveIndicator.classList.remove("show"), 1200);
    }, 400);
  }

  function switchTab(tab) {
    state.activeTab = tab;
    el.tabBtns.forEach((btn) => btn.classList.toggle("active", btn.dataset.tab === tab));
    el.todoTab.classList.toggle("hidden", tab !== "todo");
    el.memoTab.classList.toggle("hidden", tab !== "memo");
  }

  function changeMonth(delta) {
    let newMonth = state.viewMonth + delta;
    let newYear = state.viewYear;
    if (newMonth < 0) { newMonth = 11; newYear -= 1; }
    else if (newMonth > 11) { newMonth = 0; newYear += 1; }
    state.viewYear = newYear;
    state.viewMonth = newMonth;
    renderCalendar();
  }

  function goToday() {
    const today = new Date();
    state.viewYear = today.getFullYear();
    state.viewMonth = today.getMonth();
    selectDate(formatKey(today));
  }

  el.prevMonth.addEventListener("click", () => changeMonth(-1));
  el.nextMonth.addEventListener("click", () => changeMonth(1));
  el.todayBtn.addEventListener("click", goToday);
  el.tabBtns.forEach((btn) => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));
  el.todoForm.addEventListener("submit", (e) => { e.preventDefault(); addTodo(el.todoInput.value); el.todoInput.value = ""; el.todoInput.focus(); });
  el.memoText.addEventListener("input", handleMemoInput);

  renderCalendar();
  renderSidePanel();
})();
  </script>
</body>
</html>
